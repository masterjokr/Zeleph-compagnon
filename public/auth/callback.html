<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord OAuth Callback - Les Zéléphants Volants</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #5865F2;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(88, 101, 242, 0.2);
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 700; color: #fff; }
    p { margin: 0 0 16px 0; font-size: 13px; color: #94a3b8; line-height: 1.5; }
    .avatar-preview {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 2px solid #10b981;
      margin: 12px auto;
      object-fit: cover;
      display: none;
    }
    .error-box {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      display: none;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
    </div>

    <h2 id="title">Authentification Discord...</h2>
    <p id="desc">Vérification de vos identifiants et récupération de votre profil officiel.</p>
    
    <div id="spinner" class="spinner"></div>
    <img id="avatar" class="avatar-preview" alt="Avatar" />
    <div id="error-box" class="error-box"></div>
  </div>

  <script>
    async function init() {
      const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
      const search = window.location.search.startsWith('?') ? window.location.search.substring(1) : window.location.search;
      const params = new URLSearchParams(hash || search);

      const error = params.get('error');
      const errorDesc = params.get('error_description');

      if (error) {
        showError(errorDesc || error);
        return;
      }

      const token = params.get('access_token');
      if (!token) {
        showError('Aucun jeton d\'authentification Discord trouvé.');
        return;
      }

      try {
        const res = await fetch('https://discord.com/api/v10/users/@me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          throw new Error('Erreur API Discord: ' + res.status);
        }

        const user = await res.json();
        const avatarUrl = user.avatar
          ? 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png?size=256'
          : 'https://cdn.discordapp.com/embed/avatars/0.png';

        const payload = {
          type: 'DISCORD_OAUTH_SUCCESS',
          token: token,
          user: {
            id: user.id,
            username: user.username,
            globalName: user.global_name || user.username,
            discriminator: user.discriminator !== '0' ? user.discriminator : undefined,
            avatarUrl: avatarUrl,
            email: user.email
          }
        };

        // UI success state
        document.getElementById('spinner').style.display = 'none';
        const img = document.getElementById('avatar');
        img.src = avatarUrl;
        img.style.display = 'block';

        const title = document.getElementById('title');
        title.innerText = 'Bienvenue, ' + (user.global_name || user.username) + ' !';
        title.style.color = '#34d399';

        document.getElementById('desc').innerText = 'Profil Discord synchronisé avec l\'Espace Membres. Fermeture automatique...';

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
          setTimeout(() => {
            try { window.close(); } catch(e) {}
          }, 1200);
        } else {
          localStorage.setItem('zeleph_pending_discord_oauth', JSON.stringify(payload));
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        }
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').innerText = 'Erreur d\'authentification';
      document.getElementById('title').style.color = '#f87171';
      const errBox = document.getElementById('error-box');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    init();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Mountain Silhouettes (Bauges / Nivolet / Sire) -->
  <path d="M0 360 L130 260 L210 320 L330 220 L440 310 L512 250 L512 512 L0 512 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M0 400 L110 310 L220 380 L350 280 L460 360 L512 320 L512 512 L0 512 Z" fill="url(#mountainGrad)" />
  
  <!-- Lac du Bourget reflection shimmer -->
  <ellipse cx="256" cy="460" rx="180" ry="25" fill="#38bdf8" opacity="0.35" filter="blur(10px)"/>

  <!-- Paraglider Canopy (Arc) -->
  <path d="M 96 170 C 140 70, 372 70, 416 170 C 372 135, 140 135, 96 170 Z" fill="url(#wingGrad)" filter="url(#glow)"/>
  
  <!-- Paraglider Cells Lines -->
  <path d="M 140 152 Q 170 125 200 150" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" fill="none"/>
  <path d="M 200 150 Q 256 122 312 150" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" fill="none"/>
  <path d="M 312 150 Q 342 125 372 152" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" fill="none"/>

  <!-- Suspension Lines -->
  <path d="M 106 166 L 256 260" stroke="#f1f5f9" stroke-width="2.5" stroke-opacity="0.75" />
  <path d="M 170 148 L 256 260" stroke="#f1f5f9" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 256 142 L 256 260" stroke="#f1f5f9" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 342 148 L 256 260" stroke="#f1f5f9" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 406 166 L 256 260" stroke="#f1f5f9" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- The Flying Elephant (Z'éléph) in Harness Silhouette -->
  <!-- Elephant head & ears -->
  <g transform="translate(256, 260) scale(0.9)" filter="url(#glow)">
    <!-- Harness Seat / Body -->
    <ellipse cx="0" cy="18" rx="26" ry="18" fill="#f8fafc"/>
    <!-- Elephant Ear flapping like glider wing -->
    <path d="M -8 8 C -26 -10, -40 14, -20 28 C -10 32, -4 20, -8 8 Z" fill="#e2e8f0"/>
    <path d="M 8 8 C 26 -10, 40 14, 20 28 C 10 32, 4 20, 8 8 Z" fill="#cbd5e1"/>
    <!-- Head -->
    <circle cx="0" cy="6" r="15" fill="#f8fafc"/>
    <!-- Cute eye -->
    <circle cx="-5" cy="4" r="2.5" fill="#0f172a"/>
    <circle cx="-4" cy="3" r="0.8" fill="#ffffff"/>
    <!-- Trunk curled forward catching thermal -->
    <path d="M 0 14 C -6 20, -18 24, -22 18 C -25 14, -22 8, -17 12" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Tiny pilot helmet with visor -->
    <path d="M -8 1 C -8 -9, 8 -9, 8 1 Z" fill="#ea580c"/>
    <rect x="-7" y="1" width="14" height="3" rx="1.5" fill="#38bdf8"/>
  </g>

  <!-- Club Banner Text: ZÉLEPH -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="6" fill="#f8fafc">LES Z'ÉLÉPH</text>
  <text x="256" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="2" fill="#38bdf8">CHAMBÉRY • PARAPENTE</text>
</svg>
